[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scilex"
version = "0.1.0"
description = "Science Literature Exploration - systematic literature review toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13",
    "bibtexparser>=2.0.0b7",
    "fake-useragent>=2.0",
    "httpx<0.28.0",
    "lxml>=6.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "ratelimit>=2.2",
    "requests>=2.32",
    "simplejson>=3.19",
    "tenacity>=9.0",
    "tqdm>=4.66",
    "python-dateutil>=2.9",
    "matplotlib>=3.7",
    "rdflib>=7.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
]
graph = [
    "python-louvain>=0.16",
    "scipy>=1.11",  # networkx PageRank
]
gui = [
    "scilex[graph]",  # the app runs the Graph analysis
    "scilex[kg]",  # ⑦ Export builds the knowledge graph (scilex-lpwc-ap)
    "nicegui>=3.18.0",
    "platformdirs>=4.12.4",
    "pywebview>=6.2.1",
    # Linux has no system web view Python bindings to rely on: ship Qt WebEngine.
    "pywebview[qt]>=6.2.1; sys_platform == 'linux'",
]
build = [
    "pyinstaller>=6.22.3",
]
kg = [
    # Knowledge graph with the scilex-lpwc-ap profile (scilex-build-kg).
    # morph-kgc 2.10 caps rdflib below 7.3 and pyoxigraph below 0.4.
    "morph-kgc==2.10.0",
    "pyoxigraph>=0.3.22",
    "pyshacl>=0.26",
    "pylatexenc>=2.10",
]

[project.scripts]
scilex = "scilex.__main__:main"
scilex-collect = "scilex.run_collection:main"
scilex-aggregate = "scilex.aggregate_collect:main"
scilex-enrich = "scilex.enrich_with_pwc:main"
scilex-push-zotero = "scilex.push_to_zotero:main"
scilex-export-bibtex = "scilex.export_to_bibtex:main"
scilex-report = "scilex.report_charts:main"
scilex-enrich-citations = "scilex.enrich_with_citations:main"
scilex-export-turtle = "scilex.export_to_turtle:main"
scilex-build-kg = "scilex.build_kg:main"
scilex-analyze = "scilex.analyze:main"
scilex-snowball = "scilex.snowball_sampling:main"
scilex-seed = "scilex.seed_papers:main"
scilex-summarize = "scilex.summarize_clusters:main"
scilex-suggest-keywords = "scilex.suggest_keywords:main"
scilex-init = "scilex.init_templates:main"
scilex-gui = "scilex.gui.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["."]
markers = [
    "live: tests that require network access and local data (deselect with '-m \"not live\"')",
    "real_batch: reference_fetcher tests that exercise the SemanticScholar batch lookup (mocked HTTP)",
]

[tool.coverage.run]
source = ["scilex"]
omit = [
    "scilex/__main__.py",
    "scilex/tagging/*",
    "scilex/HuggingFace/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
fix = true
indent-width = 4
exclude = [
    ".venv",
    "__pycache__",
    "*.pyc",
    ".DS_Store",
    ".vscode",
    "*.egg-info",
    "dist",
    "build",
    ".deprecated",
    "scilex/kg/ap",  # pinned copy of the scilex-lpwc-ap profile (third-party code)
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "SIM103",  # Return negated condition directly (style preference)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
